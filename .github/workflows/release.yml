# Build the macOS disk image and attach it to a GitHub release.
#
# Triggered by a tag rather than by a push to master: a release is a thing
# somebody decides to make, and tagging is how they say so. Running on every
# push would produce a stream of artefacts nobody asked for and no way to tell
# which one is meant to be downloaded.
#
# The runner is `macos-14`, pinned rather than `macos-latest`, because the
# runner image decides the architecture of the build and `latest` moves without
# telling anyone. It is Apple Silicon, which matches the only arch this app
# packages for.
name: Release

on:
  push:
    tags:
      - "v*"
  # So the build can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Electron-ABI copy of better-sqlite3. Not in the repository — it is a
      # binary — so it is fetched here, and the packaged app fails at startup
      # without it.
      - run: node apps/desktop/scripts/fetch-electron-sqlite.mjs

      # A broken build is worth catching before it is published, not after
      # somebody downloads it.
      - run: npm run typecheck
      - run: npm test

      # Signing is optional and stays that way. Without the secrets this step
      # does nothing and the build below produces the same ad-hoc signed disk
      # image it always has — which still runs, but which macOS quarantines on
      # download. With them, the app is signed and notarised and opens without
      # ceremony.
      #
      # A throwaway keychain rather than the runner's login one: the runner is
      # discarded after the job, but a certificate should not outlive the step
      # that needed it even so.
      - name: Import the Developer ID certificate, if there is one
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret — building unsigned."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign stops to ask for permission nobody can give.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # The notary key is a file on disk, not a string: electron-builder reads
      # APPLE_API_KEY as a path. So the secret carries the .p8 base64-encoded
      # and it is written out here, inside the runner's temp directory.
      - name: Write the notary key, if there is one
        id: notary
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "No APPLE_API_KEY_P8 secret — the build will not be notarised."
            exit 0
          fi
          KEY=$RUNNER_TEMP/notary.p8
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "path=$KEY" >> "$GITHUB_OUTPUT"

      # Credentials reach electron-builder through the environment and appear
      # nowhere in the repository. Absent, it skips notarising and says so; the
      # build still succeeds.
      - run: npm run dist --workspace=@anthill/desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ steps.notary.outputs.path }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Says plainly which of the two kinds of build this is, so a failure to
      # sign cannot be discovered later by somebody downloading it.
      - name: Report how the app was signed
        run: |
          codesign -dv --verbose=2 apps/desktop/release/mac-arm64/Anthill.app 2>&1 \
            | grep -E "Signature|TeamIdentifier" || true
          if codesign -dv apps/desktop/release/mac-arm64/Anthill.app 2>&1 | grep -q "adhoc"; then
            echo "::warning::Ad-hoc signed. macOS will quarantine this download."
          else
            spctl -a -vv -t install apps/desktop/release/mac-arm64/Anthill.app 2>&1 || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: anthill-macos-arm64
          path: apps/desktop/release/*.dmg

      # Only for a tag. A manual run leaves the artefact above and publishes
      # nothing.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.dmg
          # Said on the release itself, because it is the first thing a
          # downloader meets and the last thing they will read afterwards.
          body: |
            macOS, Apple Silicon.

            A signed, notarised build opens on a double-click. If this one was
            built without the signing secrets, macOS refuses it on the first
            try — let it be refused, then allow it once:

            - **macOS 15 and later** — System Settings ▸ Privacy & Security ▸
              *Open Anyway*, at the bottom.
            - **macOS 14 and earlier** — right-click the app in Applications
              and choose *Open*.

            After that it launches normally. A signed build needs none of this.
